events {
    worker_connections 1024;
}

http {
    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Definir el grupo de servidores backend
    upstream backend {
        # Round Robin es el algoritmo por defecto
        # Configuración de health checks y failover
        server server1:80 max_fails=3 fail_timeout=30s;
        server server2:80 max_fails=3 fail_timeout=30s;
    }

    # Servidor del balanceador de carga
    server {
        listen 80;
        
        # Timeouts para mejor rendimiento
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Header para identificar qué servidor respondió
            add_header X-Served-By $upstream_addr always;
        }

        # Endpoint de health check para el load balancer
        location /health {
            access_log off;
            return 200 "Load Balancer OK\n";
            add_header Content-Type text/plain;
        }
    }
}