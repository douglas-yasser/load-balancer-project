version: '3.8'

services:
  # Servidor Web 1
  server1:
    build: ./server1
    container_name: web_server_1
    networks:
      - webnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servidor Web 2
  server2:
    build: ./server2
    container_name: web_server_2
    networks:
      - webnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Balanceador de Carga (Nginx)
  load_balancer:
    image: nginx:alpine
    container_name: nginx_load_balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server1:
        condition: service_healthy
      server2:
        condition: service_healthy
    networks:
      - webnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  webnet:
    driver: bridge