version: '3.8'

services:
  # Servidor Web 1
  server1:
    build: ./server1
    container_name: web_server_1
    networks:
      - webnet
    restart: unless-stopped

  # Servidor Web 2
  server2:
    build: ./server2
    container_name: web_server_2
    networks:
      - webnet
    restart: unless-stopped

  # Balanceador de Carga (Nginx)
  load_balancer:
    image: nginx:alpine
    container_name: nginx_load_balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
    networks:
      - webnet
    restart: unless-stopped

networks:
  webnet:
    driver: bridge